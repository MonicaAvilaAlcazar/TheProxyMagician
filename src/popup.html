<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Proxy Magician</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand">
      <img src="../icons/icon48.png" alt="">
      <h1>The Proxy Magician</h1>
    </div>
    <button class="icon-btn" id="openOptions" title="Manage proxies" aria-label="Manage proxies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main>
    <section class="status card" id="status" aria-live="polite">
      <span class="dot" id="statusDot"></span>
      <div class="status-text">
        <strong id="statusTitle">Loading…</strong>
        <span class="mono" id="statusDetail"></span>
      </div>
    </section>

    <div id="notices"></div>

    <section>
      <h2 class="section-title">Proxies <span class="count" id="count"></span></h2>
      <ul class="profile-list" id="profileList"></ul>
      <div class="empty card hidden" id="empty">
        <p>No proxies saved yet.</p>
        <button class="btn btn-primary" id="addFirst">Add your first proxy</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Turn proxy off</h2>
      <div class="modes">
        <button class="mode-btn" id="modeSystem" data-mode="system">
          <strong>System settings</strong>
          <span>Use your computer's proxy</span>
        </button>
        <button class="mode-btn" id="modeDirect" data-mode="direct">
          <strong>Direct</strong>
          <span>Never use a proxy</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="popup-footer">
    <button class="btn btn-ghost" id="addProxy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add proxy
    </button>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
