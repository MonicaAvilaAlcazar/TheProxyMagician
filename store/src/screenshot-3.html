<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="stage.css">
<style>
  body { --w: 1280px; --h: 800px; display: flex; flex-direction: column; align-items: center; padding-top: 36px; box-sizing: border-box; }
  .copy { text-align: center; margin-bottom: 24px; }
  .copy h1 { font-size: 42px; margin-bottom: 8px; }
  .copy p { max-width: none; font-size: 20px; }
.window { transform: scale(0.78); transform-origin: top center; }
</style></head>
<body>
  <div class="copy">
    <h1>HTTP, HTTPS, SOCKS4 and SOCKS5</h1>
    <p>Automatic sign-in for proxies that need a username and password.</p>
  </div>
  <div class="window"><iframe id="f" width="1260" height="820"></iframe></div>
  <script src="frame.js"></script>
  <script>
    mountExtensionPage(document.getElementById('f'), 'options.html', (doc) => {
      doc.querySelector('.row .tools .btn:not(.btn-ghost):not(.btn-danger)').click();
      const dlg = doc.getElementById('editor');
      dlg.querySelector('#password').blur();
      doc.activeElement && doc.activeElement.blur();
    });
  </script>
</body></html>
